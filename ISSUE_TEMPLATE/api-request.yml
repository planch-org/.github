name: API request
description: Ask the API owner for a change needed by a customer request.
title: "[API request] "
body:
  - type: markdown
    attributes:
      value: |
        **API owner:** reply in a comment within 2 working days with one of:
        **No impact** / **Compatibility change needed** / **New work needed**,
        plus an estimate and any blockers.
  - type: input
    id: request-link
    attributes:
      label: Link to the customer request
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need and user problem
    validations:
      required: true
  - type: input
    id: cause-effect
    attributes:
      label: Cause and effect
      placeholder: When X is set in Dashboard, users of Business see Y
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Example payload or fields
      render: json
  - type: input
    id: default
    attributes:
      label: Default for existing data
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - Low
        - Normal
        - High
        - Blocking a customer
