name: Customer request
description: Record what a customer asked for, in their own words.
title: "[Request] "
body:
  - type: textarea
    id: request
    attributes:
      label: Customer's request
      description: In their own words. Quote them if you can.
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Account or customer name
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - Dashboard support
        - Business support
        - Internal
        - Sales
  - type: dropdown
    id: count
    attributes:
      label: How many customers asked
      options:
        - "1"
        - "2-5"
        - "6+"
  - type: input
    id: conversation
    attributes:
      label: Link to the conversation
