name: Impact review
description: Ask a product owner to review the impact of a requested change.
title: "[Impact review] "
body:
  - type: markdown
    attributes:
      value: |
        **Reviewer:** reply in a comment within 2 working days with one of:
        **No impact** / **Compatibility change needed** / **New work needed**,
        plus an estimate and any blockers.
  - type: input
    id: request-link
    attributes:
      label: Link to the request
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Which product is asked
      options:
        - Dashboard
        - Business
        - CRM
        - Promo
        - API
  - type: input
    id: cause-effect
    attributes:
      label: Cause and effect
      placeholder: When X is set in Dashboard, users of Business see Y
    validations:
      required: true
  - type: textarea
    id: api-change
    attributes:
      label: Draft API change
      placeholder: Describe the draft change, or write "pending"
  - type: textarea
    id: questions
    attributes:
      label: Questions for the reviewer
